name: apt

# The apt repository https://deb.azsupport.dev on the GitHub Pages of this repository:
# tools/build.sh takes the packages azsupport-ffmpeg and azsupport-imagemagick7 that azsupport/ports
# publishes (its workflow ubuntu.yml, releases azsupport-<ubuntu24|ubuntu22|debian13|debian12>-amd64-<v3|v2>),
# makes the suites noble, jammy, trixie and bookworm with the components v3 and v2 (those
# published), signs them with the key of the
# secret APT_SIGNING_KEY (made by aZ) and, when a package changed, publishes the site;
# then apt reads it at its address. Run by hand right after each new build of ports; the
# hourly schedule is the fallback (GitHub drops most runs of such schedules: every few
# hours).

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even when no package changed'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: apt
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.site.outputs.changed }}
      suites: ${{ steps.site.outputs.suites }}
    steps:
      - uses: actions/checkout@v5

      - name: apt-ftparchive
        run: command -v apt-ftparchive > /dev/null || sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends apt-utils

      - name: The site
        id: site
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: sh tools/build.sh site

      - name: The site, for Pages
        if: steps.site.outputs.changed == 'yes'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # apt at the address of the site, every run (also when nothing was published: the site
  # as servers see it): each suite and level that tools/build.sh made, both packages
  # downloaded
  check:
    needs: [build, deploy]
    if: ${{ always() && needs.build.result == 'success' && needs.deploy.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: apt at the address of the site
        env:
          URL: https://deb.azsupport.dev
          SUITES: ${{ needs.build.outputs.suites }}
        run: |
          u="${URL%/}"
          [ -n "$SUITES" ] || { echo "::error title=apt::no suite from tools/build.sh"; exit 1; }
          curl -fsSL -o "$RUNNER_TEMP/azsupport.gpg" "$u/azsupport.gpg"
          rc=0
          for s in noble jammy trixie bookworm; do
            for l in v3 v2; do
              case " $SUITES " in *" $s/$l "*) ;; *) echo "$s $l: not made (not published by azsupport/ports yet)"; continue ;; esac
              q="$RUNNER_TEMP/q-$s-$l"
              mkdir -p "$q/lists/partial" "$q/archives/partial" "$q/etc"
              echo "deb [signed-by=$RUNNER_TEMP/azsupport.gpg] $u $s $l" > "$q/etc/sources.list"
              o="-q -o Dir::State::Lists=$q/lists -o Dir::Cache=$q -o Dir::Cache::archives=$q/archives -o Dir::Etc::SourceList=$q/etc/sources.list -o Dir::Etc::SourceParts=/nonexistent -o Debug::NoLocking=1"
              if apt-get $o update > "$q.log" 2>&1 && ! grep -q -E '^(E|W):' "$q.log" && (cd "$q" && apt-get $o download azsupport-ffmpeg azsupport-imagemagick7 >> "$q.log" 2>&1); then
                echo "$s $l: azsupport-ffmpeg $(apt-cache $o policy azsupport-ffmpeg | sed -n 's/^ *Candidate: //p'), azsupport-imagemagick7 $(apt-cache $o policy azsupport-imagemagick7 | sed -n 's/^ *Candidate: //p'); downloaded: $(ls "$q" | grep -c '\.deb$')"
              else
                echo "::error title=apt::$s $l at $u: $(grep -E '^(E|W):' "$q.log" | head -n 2 | tr '\n' ' ')"
                rc=1
              fi
            done
          done
          exit $rc
